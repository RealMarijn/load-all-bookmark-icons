<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    
    .status {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50, #45a049);
      transition: width 0.3s ease;
    }
    
    .current-url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-top: 10px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    
    .btn-primary {
      background: #0066cc;
      color: white;
    }
    
    .btn-primary:hover {
      background: #0052a3;
    }
    
    .btn-secondary {
      background: #f44336;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #da190b;
    }
    
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .settings-link {
      text-align: center;
      margin-top: 15px;
    }
    
    .settings-link a {
      color: #0066cc;
      text-decoration: none;
      font-size: 12px;
    }
    
    .settings-link a:hover {
      text-decoration: underline;
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📑 Bookmark Icon Loader</h1>
  </div>
  
  <div class="status" id="status">
    <div id="idle-status">
      <p><strong>Ready to load bookmark icons</strong></p>
      <p>This will open each bookmarked website briefly to load and cache its favicon.</p>
    </div>
    
    <div id="loading-status" class="hidden">
      <p><strong>Loading bookmark icons...</strong></p>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p id="progress-text">0 / 0 completed</p>
      <div class="current-url" id="current-url"></div>
    </div>
    
    <div id="complete-status" class="hidden">
      <p><strong>✅ Loading complete!</strong></p>
      <p id="completion-text">All bookmark icons have been loaded.</p>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" id="start-btn">Start Loading</button>
    <button class="btn btn-secondary hidden" id="stop-btn">Stop</button>
  </div>
  
  <div class="settings-link">
    <a href="#" id="settings-link">⚙️ Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
